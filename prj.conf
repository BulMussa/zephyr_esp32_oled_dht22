# Animation shown at power-up (switch at runtime from the web page)
CONFIG_APP_ANIMATION_PONG=y
# CONFIG_APP_ANIMATION_SINE=y

# SSD1306 OLED display
CONFIG_I2C=y
CONFIG_DISPLAY=y

# DHT22 sensor
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_DHT=y

# Stack for Wi-Fi and network setup in main()
CONFIG_MAIN_STACK_SIZE=4096

# Memory for the Wi-Fi driver and network threads. The defaults are too
# small once a device connects (station state, WPA2 handshake, DHCP reply).
# Heap: measured peak 49,924 B with one phone (the AP allows only one);
# 96 KB leaves room for bursts of Wi-Fi receive buffers. See MEMORY.md.
CONFIG_HEAP_MEM_POOL_SIZE=98304
# 3 KB: measured peak 1,640 B, plus the Wi-Fi idle check (lib/net/wifi_ap.c)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048

# Wi-Fi access point
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4_SERVER=y

# HTTP server
CONFIG_NET_SOCKETS=y
CONFIG_HTTP_SERVER=y
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10

# Debugging: log output and crash reports on the console
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y

# Shell on the USB console: "kernel thread stacks" shows stack usage
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
# "kernel heap" shows heap usage and the peak since boot
CONFIG_SYS_HEAP_RUNTIME_STATS=y
